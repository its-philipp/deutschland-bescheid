<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand mark: a letter sheet with a black-red-gold accent bar. Sized for
       16px legibility (large sheet, full-width bar). Deliberately NOT a flag
       or coat of arms — the site must not read as an official government
       service (see STATE.md).

       Colours follow the site palette (design direction E, 2026-08-02):
       Stempelblau ground, Aktendeckelgrün rules, and the three stripes in the
       desaturated black-red-gold the accent palette is drawn from. Keep in
       sync with public/logo.svg. -->
  <rect width="64" height="64" rx="14" fill="#2B4C7E" />
  <g>
    <clipPath id="sheet">
      <rect x="13" y="7" width="38" height="50" rx="5" />
    </clipPath>
    <rect x="13" y="7" width="38" height="50" rx="5" fill="#ffffff" />
    <g clip-path="url(#sheet)">
      <rect x="20" y="16" width="24" height="5" rx="2.5" fill="#C7CFC9" />
      <rect x="20" y="26" width="16" height="5" rx="2.5" fill="#C7CFC9" />
      <rect x="13" y="40" width="38" height="5" fill="#1F2421" />
      <rect x="13" y="45" width="38" height="5" fill="#8C2F2A" />
      <rect x="13" y="50" width="38" height="5" fill="#B08419" />
    </g>
  </g>
</svg>
